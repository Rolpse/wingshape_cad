name: Python tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install schema test dependency
        run: python -m pip install jsonschema
      - name: Run unit tests
        run: python -m unittest discover -v
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run board editor tests
        run: node --test prototype/board-outline-editor.test.cjs
